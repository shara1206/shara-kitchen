  <main>
    <div class="recipe-notes">
      <h3 data-en="Konjac Flour Notes" data-zh="魔芋粉说明">魔芋粉说明</h3>
      <p data-zh="国内买的普通魔芋粉里葡聚糖（Glucomannan）含量约 45%。" data-en="Standard konjac powder sold in China contains about 45% glucomannan.">国内买的普通魔芋粉里葡聚糖（Glucomannan）含量约 45%。</p>
      <p data-zh="葡聚糖与黄原胶（Xanthan Gum）的换算比例为 &lt;strong&gt;1 : 1&lt;/strong&gt;。" data-en="The conversion ratio of glucomannan to xanthan gum is &lt;strong&gt;1 : 1&lt;/strong&gt;.">葡聚糖与黄原胶（Xanthan Gum）的换算比例为 <strong>1 : 1</strong>。</p>

      <h3 data-en="Substituting Xanthan Gum for Konjac Flour" data-zh="用黄原胶代替魔芋粉">用黄原胶代替魔芋粉</h3>
      <p data-zh="实际使用时，1:1 换算做麻薯类口感太硬。" data-en="In practice, a 1:1 swap makes mochi-type textures too firm.">实际使用时，1:1 换算做麻薯类口感太硬。</p>
      <p data-zh="建议从 &lt;strong&gt;33% 的重量&lt;/strong&gt;开始试（即食谱中魔芋粉用量 × 0.33）。" data-en="Start with &lt;strong&gt;33% of the weight&lt;/strong&gt; (konjac powder amount in recipe × 0.33) and adjust.">建议从 <strong>33% 的重量</strong>开始试（即食谱中魔芋粉用量 × 0.33）。</p>
      <div class="tip">例如：食谱要 10g 魔芋粉 → 试用约 3.3g 黄原胶</div>

      <h3>参考产品</h3>
